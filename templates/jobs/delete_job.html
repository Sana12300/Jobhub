
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Job | JobHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .cancel-link {
            margin-left: 12px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delete Job</h1>

        <p>Are you sure you want to delete this job?</p>
        <h3>{{ job.title }}</h3>
        <p>{{ job.company }}</p>

        <form method="POST">
            {% csrf_token %}
            <button class="delete-btn" type="submit">Yes, Delete</button>
            <a class="cancel-link" href="{% url 'recruiter_dashboard' %}">
                Cancel
            </a>
        </form>
    </div>
</body>
</html>
